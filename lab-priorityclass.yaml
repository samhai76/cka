apiVersion: v1
kind: Namespace
metadata:
  name: priority
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: dev-pc
value: 1000000
globalDefault: false
description: "This priority class should only be used for all development pods."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: preprod-pc
value: 2000000
globalDefault: false
description: "This priority class should only be used for all preprod pods."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: prod-pc
value: 4000000
globalDefault: false
description: "This priority class should only be used for all prod pods."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-nginx
  labels:
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      env: dev
  template:
    metadata:
      labels:
        env: dev
    spec:
      priorityClassName: dev-pc
      containers:
      - name: dev-nginx
        image: nginx
        resources:
          requests:
            memory: "256Mi"
            cpu: "0.2"
          limits:
            memory: "500Mi"
            cpu: "0.5"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preprod-nginx
  labels:
    env: preprod
spec:
  replicas: 1
  selector:
    matchLabels:
      env: preprod
  template:
    metadata:
      labels:
        env: preprod
    spec:
      priorityClassName: preprod-pc
      containers:
      - name: preprod-nginx
        image: nginx
        resources:
          requests:
            memory: "1.5Gi"
            cpu: "1.5"
          limits:
            memory: "2Gi"
            cpu: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-nginx
  labels:
    env: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      env: prod
  template:
    metadata:
      labels:
        env: prod
    spec:
      priorityClassName: prod-pc
      containers:
      - name: prod-nginx
        image: nginx
        resources:
          requests:
            memory: "2Gi"
            cpu: "2"
          limits:
            memory: "2Gi"
            cpu: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-logger
  namespace: priority
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox-logger
  template:
    metadata:
      labels:
        app: busybox-logger
    spec:
      containers:
      - name: busybox-logger
        image: busybox
        command: ["sh", "-c", "while true; do echo logging; sleep 5; done"]
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
