apiVersion: v1
kind: Namespace
metadata:
  name: autoscale
---
# Deploy apache-server and expose it as a Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-server
  namespace: autoscale
spec:
  selector:
    matchLabels:
      run: apache-server
  template:
    metadata:
      labels:
        run: apache-server
    spec:
      containers:
      - name: apache-server
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 500m
          requests:
            cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: apache-server
  namespace: autoscale
  labels:
    run: apache-server
spec:
  ports:
  - port: 80
  selector:
    run: apache-server
